<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꺼진 등불의 땅</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030406;
      }
      #renderCanvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #fatal {
        position: fixed;
        inset: auto 16px 16px 16px;
        padding: 12px 16px;
        color: #f3d9c4;
        background: rgba(60, 10, 10, 0.85);
        font: 14px/1.4 system-ui, sans-serif;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="fatal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
