# main에 푸시하면 검사(타입/린트/테스트) → 빌드 → GitHub Pages 배포.
# 검사가 하나라도 실패하면 배포하지 않는다.
# 저장소 Settings → Pages → Source가 "GitHub Actions"여야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LFS는 게임이 쓰는 public/assets만 받는다 (raw/ 원본까지 받으면 LFS 월 다운로드 한도를 빨리 쓴다)
      - run: git lfs pull --include="public/assets/**"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:credits
      - run: npm test
      - run: npm run test:py # tools/blender 공용 로직 (블렌더 불필요)
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
